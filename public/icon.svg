<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6"/>

  <!-- Concentric Neon Rings -->
  <!-- Outer ring with gap -->
  <path d="M 256,76 A 180,180 0 1,1 128,128" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" filter="url(#neonGlow)"/>
  
  <!-- Middle ring with gap -->
  <path d="M 376,256 A 120,120 0 1,1 256,136" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Inner ring with gap -->
  <path d="M 200,256 A 60,60 0 1,0 256,196" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Central Glowing Goal Core -->
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Racing Flag Marble Silhouette -->
  <g transform="translate(320, 190)">
    <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#38bdf8" stroke-width="4" filter="url(#neonGlow)"/>
    <!-- Checkered / Flag hint -->
    <path d="M -22,-22 H 22 V 22 H -22 Z" fill="#ef4444" opacity="0.85" clip-path="circle(28px)"/>
    <circle cx="0" cy="0" r="14" fill="#fbbf24"/>
  </g>

  <g transform="translate(180, 310)">
    <circle cx="0" cy="0" r="26" fill="#10b981" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>
</svg>
